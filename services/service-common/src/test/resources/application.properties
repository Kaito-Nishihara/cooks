# 共通のライブラリのテストだけで使う設定。
quarkus.application.name=probe-service

# ログの行を確かめるために、JSON のログをファイルにも出す
quarkus.log.file.enabled=true
quarkus.log.file.path=target/test-logs/app.json
quarkus.log.file.rotation.rotate-on-boot=false
quarkus.log.json.file.enabled=true
quarkus.log.json.console.enabled=false

# ほかのサービスの代役。このテストのアプリの中に置く
quarkus.rest-client.relay-target.url=http://localhost:${quarkus.http.test-port:8081}
