# 3 つのサービスに共通する設定の初期値。
# サービスの application.properties のほうが優先されるので、必要なときはそちらで上書きする。

# ログは、標準出力に、1 行に 1 件の JSON で出す(「共通設計: サービスの共通構成」の 4.6)
quarkus.log.json.console.enabled=true
quarkus.log.json.fields.timestamp.zone-id=UTC
quarkus.log.json.fields.logger-name.field-name=logger
quarkus.log.json.fields.stack-trace.field-name=stackTrace
# 要求の識別子などを、ほかの項目と同じ階層に出す
quarkus.log.json.fields.mdc.flat-fields=true
quarkus.log.json.fields.arguments.include-structured-arguments=true
quarkus.log.json.additional-field.service.value=${quarkus.application.name}
# 使わない項目を出さない
quarkus.log.json.fields.sequence.enabled=false
quarkus.log.json.fields.logger-class-name.enabled=false
quarkus.log.json.fields.hostname.enabled=false
quarkus.log.json.fields.process-name.enabled=false
quarkus.log.json.fields.process-id.enabled=false
quarkus.log.json.fields.thread-id.enabled=false
quarkus.log.json.fields.ndc.enabled=false
quarkus.log.json.fields.error-type.enabled=false
quarkus.log.json.fields.error-message.enabled=false

# 書いている間とテストの間は、人が読みやすい形で出す
%dev.quarkus.log.json.console.enabled=false
%test.quarkus.log.json.console.enabled=false

# 受け取ったトークンの確かめ方(「共通設計: 認証」の 4.7)。
# 公開の鍵の場所(mp.jwt.verify.publickey.location)は、サービスごとに渡す。例: http://auth-service:8080/internal/auth/keys
mp.jwt.verify.issuer=auth-service
mp.jwt.verify.audiences=recipe-book
mp.jwt.verify.publickey.algorithm=RS256
# 時計のずれとして、期限を 10 秒まで過ぎても受け付ける
smallrye.jwt.expiration.grace=10
smallrye.jwt.required.claims=sub
# 公開の鍵は、5 分ごとに取り直す。知らない鍵の名前のトークンが来たときも、1 分に 1 回まで取り直す
smallrye.jwt.jwks.refresh-interval=5
smallrye.jwt.jwks.forced-refresh-interval=1
# トークンは、入口が付けた Authorization ヘッダーからだけ読む。クッキーは読まない
mp.jwt.token.header=Authorization
# 本人の確かめは、入口に当たった後で行う。確かめられないときの応答を、決まった形にするためである
quarkus.http.auth.proactive=false

# 本文の大きさは、app.http.max-body-bytes で確かめ、決まった形の 413 を返す。
# ここの値は、それより手前で打ち切る上限である。超えると、本文のない 413 になる
quarkus.http.limits.max-body-size=1M
