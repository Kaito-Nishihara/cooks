# auth-service の設定(「共通設計: サービスの共通構成」の 4.7)。
# 環境ごとに違う値と秘密の値は、ここに書かず、環境変数で渡す。
#   QUARKUS_DATASOURCE_JDBC_URL、QUARKUS_DATASOURCE_USERNAME、QUARKUS_DATASOURCE_PASSWORD
#   APP_AUTH_WEB_ORIGIN(画面のオリジン。例: http://localhost:8080)
#   APP_AUTH_SIGNING_KEY_FILE(署名の秘密の鍵のファイルの場所。鍵そのものではない)
quarkus.application.name=auth-service

# 利用者の要求は 8080、稼働の確認は 9000 で受ける(4.8)
quarkus.http.port=8080
quarkus.management.enabled=true
quarkus.management.port=9000

# 止まるときは、処理中の要求を 10 秒まで待つ(4.8)
quarkus.shutdown.timeout=10S

# データベース(5 章)。開発用のデータベースを Quarkus に起動させない
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.transaction-manager.default-transaction-timeout=10S

# テーブルは Flyway だけが作る。Hibernate は、Entity とテーブルが合っているかを確かめるだけにする
# (「共通設計: データベースの共通仕様」の 5.9)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

# 欠けていたら、起動を失敗させる設定
app.required-settings=quarkus.datasource.jdbc.url,quarkus.datasource.username,quarkus.datasource.password,app.auth.web-origin,app.auth.signing-key-file

# テストは、Compose で先に起動した PostgreSQL に対して走らせる(services/compose.yaml)。
# このデータベースは、パスワードを確かめない設定で動かしている。下の値は、設定が欠けていないことを示すだけである
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-test:5432/auth_test
%test.quarkus.datasource.username=auth_app
%test.quarkus.datasource.password=not-checked
%test.quarkus.management.test-port=9000
%test.app.auth.web-origin=http://localhost:8080
# テストを速くするために、bcrypt のコストを下げる。既定の 12 は、BcryptPasswordHasherTest で確かめる
%test.app.auth.bcrypt-cost=4
