# kitchen-service の設定(「共通設計: サービスの共通構成」の 4.7)。
# 環境ごとに違う値と秘密の値は、ここに書かず、環境変数で渡す。
#   QUARKUS_DATASOURCE_JDBC_URL、QUARKUS_DATASOURCE_USERNAME、QUARKUS_DATASOURCE_PASSWORD
#   MP_JWT_VERIFY_PUBLICKEY_LOCATION(auth-service の公開の鍵の場所。例: http://auth-service:8080/internal/auth/keys)
quarkus.application.name=kitchen-service

# 利用者の要求は 8080、稼働の確認は 9000 で受ける(4.8)
quarkus.http.port=8080
quarkus.management.enabled=true
quarkus.management.port=9000

# 止まるときは、処理中の要求を 10 秒まで待つ(4.8)
quarkus.shutdown.timeout=10S

# データベース(「共通設計: データベースの共通仕様」の 5.1)。開発用のデータベースを Quarkus に起動させない
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.transaction-manager.default-transaction-timeout=10S

# テーブルは Flyway だけが作る。Hibernate は、Entity とテーブルが合っているかを確かめるだけにする(5.9)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

# API の仕様(「共通設計: API の共通仕様」の 4.11、決定の記録 0064)。
# ビルドのたびに、リポジトリの api/ へ書き出す。/api と /internal は、service-common のフィルターで分ける
quarkus.smallrye-openapi.info-title=kitchen-service
quarkus.smallrye-openapi.store-schema-directory=../../api
quarkus.smallrye-openapi.store-schema-file-name=kitchen-service
quarkus.smallrye-openapi.internal.info-title=kitchen-service(サービスの間)
quarkus.smallrye-openapi.internal.store-schema-directory=../../api
quarkus.smallrye-openapi.internal.store-schema-file-name=kitchen-service-internal
# 分けた後に使われなくなった型を、仕様から除く
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=true

# 欠けていたら、起動を失敗させる設定
app.required-settings=quarkus.datasource.jdbc.url,quarkus.datasource.username,quarkus.datasource.password,mp.jwt.verify.publickey.location

# テストは、Compose で先に起動した PostgreSQL に対して走らせる(services/compose.yaml)。
# このデータベースは、パスワードを確かめない設定で動かしている。下の値は、設定が欠けていないことを示すだけである
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-test:5432/kitchen_test
%test.quarkus.datasource.username=kitchen_app
%test.quarkus.datasource.password=not-checked
%test.quarkus.management.test-port=9000
# 公開の鍵は、テストのアプリの中の代役(src/test の TestKeysResource)から取る
%test.mp.jwt.verify.publickey.location=http://localhost:${quarkus.http.test-port:8081}/internal/auth/keys
