# サービスのビルドとテストを、コンテナの中の Maven で動かす。ホスト側に Java と Maven を入れない。
#
# 使い方(リポジトリの直下で):
#   全部をテストする      docker compose -f services/compose.yaml run --rm maven verify
#   1 つだけテストする    docker compose -f services/compose.yaml run --rm maven -pl auth-service -am verify
#   Postman で試す        docker compose -f services/compose.yaml --profile try up auth-service
#   後片付け              docker compose -f services/compose.yaml --profile try down
name: recipe-book-services

services:
  maven:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /work/services
    entrypoint: ["mvn", "--batch-mode", "--no-transfer-progress"]
    command: ["verify"]
    environment:
      TZ: UTC
    volumes:
      - .:/work/services
      # ビルドのときに書き出す API の仕様(api/)の置き場
      - ../api:/work/api
      # 取ってきたライブラリを残す。コンテナを作り直すたびに取り直さないためである
      - maven-repository:/root/.m2
    depends_on:
      postgres-test:
        condition: service_healthy

  # Postman で試すための auth-service。try を付けたときだけ動く(services/postman/README.md)。
  #   docker compose -f services/compose.yaml --profile try up auth-service
  auth-service:
    profiles: ["try"]
    image: maven:3.9.11-eclipse-temurin-21
    entrypoint: ["bash", "/work/services/postman/start-auth-service.sh"]
    environment:
      TZ: UTC
    volumes:
      - .:/work/services
      # ビルドのときに書き出す API の仕様(api/)の置き場
      - ../api:/work/api
      - maven-repository:/root/.m2
    ports:
      # kind の入口(8080)とぶつからない番号にし、ほかの機械から届かないようにする
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9001:9000"
    depends_on:
      postgres-test:
        condition: service_healthy

  # テストだけで使う PostgreSQL。配置するものと同じ大きい番号の版にする。
  # ホスト側にポートを出さず、データをメモリに置く。止めると、中身は消える。
  postgres-test:
    image: postgres:18-alpine
    environment:
      # 外から届かない、消えてよいデータベースなので、パスワードを確かめない。
      # リポジトリに、パスワードを書かないためである
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    volumes:
      - ./test-db/init-test-databases.sh:/docker-entrypoint-initdb.d/init-test-databases.sh:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # 最初の起動の途中(初期化用の仮のサーバー)を、起動済みと見なさないように、TCP で確かめる
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kitchen_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  maven-repository:
