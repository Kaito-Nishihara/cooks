services:
  app:
    build:
      context: .
      target: dev
    ports:
      # Vite の開発サーバー。Worker も同じポートで動く(@cloudflare/vite-plugin)。
      - "5173:5173"
    volumes:
      - .:/app
      # ホストとコンテナでネイティブモジュールが衝突するため、node_modules は逃がす。
      - node_modules:/app/node_modules
      # D1 と R2 のローカルエミュレーションの状態。消すとデータが失われる。
      - wrangler_state:/app/.wrangler
    environment:
      # コンテナ内からホストへ公開するために必要。
      - HOST=0.0.0.0
    command: npm run dev

volumes:
  node_modules:
  wrangler_state:
