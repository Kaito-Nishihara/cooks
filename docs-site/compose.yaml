# 仕様書のサイトだけを起動する。アプリ本体の compose.yaml(リポジトリの直下)とは別に管理する
# 起動: docker compose -f docs-site/compose.yaml up -d  →  http://localhost:8000
# 停止: docker compose -f docs-site/compose.yaml down
name: recipe-book-docs

services:
  docs:
    image: squidfunk/mkdocs-material:9
    ports:
      - "8000:8000"
    volumes:
      # 文書の中身は読み取り専用で渡す。サイトから文書を書き換えない
      - ../docs:/work/docs:ro
      - .:/work/docs-site:ro
    working_dir: /work/docs-site
    command: serve --dev-addr=0.0.0.0:8000
