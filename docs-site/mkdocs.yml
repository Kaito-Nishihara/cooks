# 仕様書をブラウザで読むサイトの設定。アプリ本体とは別のもので、アプリの起動やビルドに関わらない
# 文書の中身は ../docs/ にあり、このディレクトリには表示の仕組みだけを置く
# 起動: docker compose -f docs-site/compose.yaml up -d  →  http://localhost:8000
site_name: おうちレシピ帖 仕様書
site_description: おうちレシピ帖の要件定義、設計、開発の決まり
docs_dir: ../docs
site_dir: /tmp/site
use_directory_urls: true

theme:
  name: material
  language: ja
  # 見た目の上書き。overrides/assets/docs.css がサイトの assets/docs.css として配られる
  custom_dir: overrides
  # 書体は docs.css で指定する
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: washi
      toggle:
        icon: material/weather-night
        name: 暗い配色にする
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 明るい配色にする
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - assets/docs.css

# 一文ごとに改行して書いた日本語を、表示のときだけ 1 つの段落に詰める
hooks:
  - hooks/join_japanese_lines.py

# 文書のほかに、見た目と変換の処理を変えたときも表示を更新する
watch:
  - overrides
  - hooks

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
      # 日本語の見出しでも、見出しへのリンクが作られるようにする
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # ```mermaid のコードブロックを図として描く
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# 文書を足したら、ここに 1 行足す。足さなくても表示されるが、並び順が名前順になる
nav:
  - はじめに: index.md
  - 要件定義: requirements.md
  - アーキテクチャ図: architecture.html
  - 共通の設計:
      - API の共通仕様: design/common-api.md
      - 認証、セッション、サービスの間の本人確認: design/common-auth.md
      - データベースの共通仕様: design/common-database.md
      - サービスの共通構成: design/common-service.md
      - 画面の共通仕様: design/common-frontend.md
  - 画面の設計:
      - 実行環境(kind、入口、Compose): design/common-runtime.md
      - 画面の一覧と遷移: design/screens.md
  - データの設計:
      - 画面の共通仕様: design/common-frontend.md
      - 元のレシピ、食材マスタ、成分表: design/data-recipe.md
  - 機能の設計:
      - 元のレシピ、食材マスタ、成分表: design/data-recipe.md
      - 栄養計算: design/nutrition.md
  - 開発の進め方:
      - Claude Code のハーネス: design/dev-harness.md
  - 決定の記録:
      - 0001 改訂番号を要求の本文で渡す: decisions/0001-revision-in-body.md
      - 0002 API のパスに版の番号を入れない: decisions/0002-no-api-version.md
      - 0003 一覧をカーソルで分けて返す: decisions/0003-cursor-pagination.md
      - 0004 ログインの状態をセッションとクッキーで持つ: decisions/0004-session-cookie.md
      - 0005 サービスの間では署名付きトークンで本人を伝える: decisions/0005-internal-jwt.md
      - 0006 パスワードのハッシュに bcrypt を使う: decisions/0006-bcrypt.md
      - 0007 PostgreSQL のサーバーを 1 つにしデータベースを分ける: decisions/0007-one-postgres-three-databases.md
      - 0008 行を消すときは実際に消す: decisions/0008-physical-delete.md
      - 0009 共通するコードを 1 つのライブラリにまとめる: decisions/0009-shared-library.md
      - 0010 期限が切れた行をサービスの中の定期の処理で消す: decisions/0010-in-service-scheduler.md
      - 0011 サービスのビルドに Maven を使う: decisions/0011-maven.md
      - 0012 サービスをドメインを中心にした層で作る: decisions/0012-domain-centered-layers.md
      - 0013 入口に Envoy Gateway を使う: decisions/0013-envoy-gateway.md
      - 0014 kind、kubectl、helm をコンテナの中で動かす: decisions/0014-tools-in-container.md
      - 0015 クラスタへ載せるのに Kustomize を使う: decisions/0015-kustomize.md
      - 0016 手元のクラスタでは PostgreSQL を 1 つの Pod で動かす: decisions/0016-postgres-statefulset.md
      - 0020 画面の部品を自分で作り外の部品集を入れない: decisions/0020-self-made-ui-components.md
      - 0021 API から取った内容を TanStack Query で持つ: decisions/0021-tanstack-query.md
      - 0022 画面側の型を openapi-typescript で作り関数は手で書く: decisions/0022-openapi-typescript.md
      - 0023 ログインが要る画面をブラウザの中の処理で守る: decisions/0023-client-side-login-guard.md
      - 0024 今開いているレシピ帳を localStorage に持つ: decisions/0024-current-book-in-local-storage.md
      - 0025 材料、手順、コツに変わらない識別子を付ける: decisions/0025-stable-item-ids.md
      - 0026 換算率を食材ごと、単位ごとに書いて持つ: decisions/0026-grams-per-unit-explicit.md
      - 0027 分量の丸め方を単位と食材マスタから決める: decisions/0027-rounding-from-unit.md
      - 0028 成分表の「微量」を 0 として読む: decisions/0028-trace-as-zero.md
      - 0029 栄養の値がない食材に印を付ける: decisions/0029-no-nutrition-flag.md
      - 0030 ビルドのときに分からない値はクエリで渡す: decisions/0030-query-for-values-unknown-at-build.md
      - 0031 招待の文字列を URL のフラグメントで渡す: decisions/0031-invitation-token-in-fragment.md
      - 0032 ヘッダーの入口を 2 つに絞る: decisions/0032-header-navigation.md
      - 0035 テストのない受け入れ条件を一覧で管理する: decisions/0035-acceptance-pending-list.md
      - 0043 栄養の値は表示するときに 1 回だけ丸める: decisions/0043-round-once-at-display.md
      - 0044 寄与が 0 と決まっている材料は計算から除かない: decisions/0044-zero-lines-are-not-excluded.md
      - 0045 範囲や目安に収まるかを画面に出る数で判定する: decisions/0045-judge-by-displayed-number.md
