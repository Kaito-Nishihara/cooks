<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>招待の確認 | おうちレシピ帖(見た目の試作)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
</head>
<body data-auth="in" data-current="" data-user="けんた" data-book="けんたのレシピ帳(持ち主)">
<main>
  <div class="wrap wrap--form stack">
    <h1 class="page-title">招待の確認</h1>
    <div class="card stack-sm">
      <p><strong>みさき</strong> さんから、レシピ帳への招待が届いています。</p>
      <dl class="stack-sm">
        <div><dt class="soft t-sm">レシピ帳</dt><dd class="t-lg"><strong>みさきのレシピ帳</strong></dd></div>
        <div><dt class="soft t-sm">参加したときの役割</dt><dd><strong>見るだけ</strong> <span class="soft t-sm">レシピと献立を見られます。変えることはできません</span></dd></div>
        <div><dt class="soft t-sm">招待の期限</dt><dd>この招待は 2026年10月18日 12:34 まで使えます</dd></div>
      </dl>
      <p class="soft t-sm">けんた として参加します</p>
      <button class="btn btn--primary btn--block" type="button">参加する</button>
      <button class="btn btn--quiet btn--block" type="button">参加しない</button>
      <p><a class="link-quiet" href="login.html">別のアカウントで参加する</a></p>
    </div>
    <h2 class="sub-title">使えない招待のとき</h2>
    <div class="notice notice--warn" role="status">
      <span class="notice__mark">注意</span>
      <div>この招待は使えません。招待した人に、もう一度リンクを作ってもらってください。</div>
    </div>
  </div>
</main>
<script src="mock.js"></script>
</body>
</html>
