<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="おうちレシピ帖">
  <!-- 候補 A: 開いた帳面。絵柄は中心から半径 205 の円の内側に収める -->
  <rect width="512" height="512" fill="#c0392b"/>
  <!-- 表紙(墨の色)。紙の下に少しずらして置き、帳面の厚みを見せる -->
  <path fill="#2b2118" d="M256 204C206 176 150 172 92 186V380C150 366 206 370 256 398C306 370 362 366 420 380V186C362 172 306 176 256 204Z"/>
  <!-- 左右の紙 -->
  <path fill="#fffdf7" d="M256 170C206 142 150 138 92 152V346C150 332 206 336 256 364C306 336 362 332 420 346V152C362 138 306 142 256 170Z"/>
  <!-- しおり(卵の黄色)。のどの位置に下げ、左右の紙を分ける -->
  <path fill="#f2b63d" d="M232 158H280V436L256 412L232 436Z"/>
</svg>
