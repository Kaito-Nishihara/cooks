# 今の静的なレシピ集(recipes/)を GitHub Pages に公開する。
# ビルドはしない。recipes/ の中身をそのまま配る。
# 新しいアプリ(frontend/、services/)は、ここでは公開しない。
name: レシピ集を GitHub Pages に公開する

on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - ".github/workflows/pages.yml"
  # 画面から手で走らせるための入口
  workflow_dispatch:

# 公開に要る権限だけを渡す
permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったときは、後から来たものを待たせる。途中の公開は止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v4

      - name: Pages の設定を読む
        uses: actions/configure-pages@v5

      - name: recipes/ を公開用にまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: recipes

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
